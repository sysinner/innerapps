; odoo.template.conf
; Odoo 19 config template. Before startup, inagent config-render does literal
; substitution of the placeholders, then inagent config-merge layers the
; overrides from the app-spec odoo_conf (text_ini).
;
; DB connection is auto-injected from the postgresql-v18 dependency — do not
; edit db_* in odoo_conf.

[options]
; ---- Database (managed postgresql-v18 dependency, bound at deploy time) ----
db_host     = ${deps.postgresql-v18.net.postgresql.internal_host}
db_port     = ${deps.postgresql-v18.net.postgresql.internal_port}
db_user     = ${deps.postgresql-v18.cfg.db_user}
db_password = ${deps.postgresql-v18.cfg.db_auth}
db_name     = ${deps.postgresql-v18.cfg.db_name}
db_sslmode  = prefer

; Use only this database; disables the DB manager (prevents accidental connects/creates)
dbfilter    = ^${deps.postgresql-v18.cfg.db_name}$

; ---- HTTP ----
http_interface = 0.0.0.0
http_port       = 8069

; ---- Data / file store (on the persistent volume) ----
data_dir = /opt/odoo/data

; ---- Addons path ----
addons_path = /opt/odoo/odoo-ce/addons,/opt/odoo/odoo-ce/odoo/addons

; ---- Logging ----
logfile   = /opt/odoo/var/log/odoo.log
log_level = info

; ---- Other (overridable via odoo_conf) ----
without_demo = all
max_cron_threads = 2
